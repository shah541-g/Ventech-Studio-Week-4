<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Render a List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header
      class="d-flex align-items-center justify-content-center mb-4 p-4 bg-dark text-white"
    >
      <div id="dark-mode-div"
        class="position-fixed top-0 end-0 me-3 mt-3 border border-2 bg-white p-3 rounded-circle"
      >
        <button class="reset" id="dark-mode-btn">
          <img src="./assets/moon-stars.svg" alt="" id="dark-mode-icon-img" />
        </button>
      </div>
      <h1 class="fw-bold text-uppercase text-center">Daily Expense Tracker</h1>
    </header>
    <main class="container customized-main">
      <section id="add-new-expense-section" class="my-4">
        <h4 class="fw-bold text-center">Add New Expense</h4>
        <form class="form">
          <div class="form-group row mb-1">
            <div class="title d-sm-flex align-items-sm-center col-12 col-sm-2">
              <label class="fw-bold" for="element-title">Title:</label>
            </div>
            <div class="col-12 col-sm-10">
              <input
                class="form-control border rounded-3 border-2 border-focus border-dark w-100"
                type="text"
                id="element-title"
              />
              <span
                id="title-warning"
                class="badge bg-danger text-white d-none"
              ></span>
            </div>
          </div>
          <div class="form-group row mb-1">
            <div class="title d-sm-flex align-items-sm-center col-12 col-sm-2">
              <label class="fw-bold" for="element-amount">Amount:</label>
            </div>
            <div class="col-12 col-sm-10">
              <input
                class="form-control border rounded-3 border-2 border-focus border-dark w-100"
                type="text"
                id="element-amount"
              />
              <span
                id="amount-warning"
                class="badge bg-danger text-white d-none"
              ></span>
            </div>
          </div>
          <div class="form-group row mb-1">
            <div class="title d-sm-flex align-items-sm-center col-12 col-sm-2">
              <label class="fw-bold" for="element-category">Category:</label>
            </div>
            <div class="col-12 col-sm-10">
              <input
                class="form-control border rounded-3 border-2 border-focus border-dark w-100"
                type="text"
                id="element-category"
              />
              <span
                id="category-warning"
                class="badge bg-danger text-white d-none"
              ></span>
            </div>
          </div>
          <hr class="my-4" />
          <div
            class="btn-wrapper d-flex align-items-center justify-content-center justify-content-sm-end"
          >
            <button
              type="button"
              id="submit-btn"
              class="w-100 btn btn-primary btn-customized"
            >
              Submit
            </button>
          </div>
        </form>
      </section>
      <section id="filter-and-list-section" class="my-4">
        <h4 class="fw-bold">Search</h4>
        <div class="filter-wrapper row form-group">
          <div class="d-none d-sm-block col-sm-6"></div>
          <div
            class="col-12 col-sm-3 d-sm-flex justify-content-sm-end align-items-sm-center"
          >
            <label class="fw-bold" for="filter">Filter: </label>
          </div>
          <div class="col-12 col-sm-3">
            <input
              class="form-control border rounded-3 border-2 border-focus border-dark w-100"
              type="text"
              id="filter"
              placeholder="  Search..."
            />
          </div>
        </div>
        <hr class="mb-4" />
        <div class="table-wrapper" id="table-wrapper">
          <h4 class="fw-bold text-center">Searched Results</h4>
          <div
            id="no-data-wrapper"
            class="d-none flex-column align-items-center justify-content-center gap-2"
          >
            <i class="bi bi-emoji-dizzy display-3"></i>
            <h5 class="fw-bold text-center">No Data</h5>
          </div>
          <table id="data-table" class="table">
            <thead class="table-dark" id="data-table-head"></thead>
            <tbody id="data-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer class="bg-dark text-center text-white mb-0">
      <p class="p-4 mb-0">&copy; All Right Reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Render a List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header
      class="d-flex flex-column flex-sm-row align-items-center justify-content-between mb-4 gap-2 p-4 light-mode-background"
      id="header"
    >
      <div
        id="dark-mode-div"
        class="position-fixed bottom-0 end-0 me-3 mb-3 border border-2 border-dark bg-white p-3 rounded-circle"
      >
        <button class="reset" id="dark-mode-btn">
          <img src="./assets/moon-stars.svg" alt="" id="dark-mode-icon-img" />
        </button>
      </div>
      <div class="d-flex align-items-center justify-content-center">
        <i
          class="bi bi-check display-6 light-mode-text border rounded-circle me-2"
          id="checkmark-icon"
        ></i>
        <h1 class="fw-bold text-uppercase text-center mb-1">My ToDo List</h1>
      </div>
      <div id="completion-status-div">
        <p id="completion-status" class="mb-0">
          <span
            id="completed-count"
            class="light-mode-text p-2 border rounded-circle m-2 fw-bold"
            >4</span
          >/<span
            id="total-count"
            class="light-mode-text p-2 border rounded-circle m-2 fw-bold"
            >6</span
          ><span id="completed-txt" class="fs-4">Completed</span>
        </p>
      </div>
    </header>
    <main class="container customized-main">
      <section
        id="add-new-task-section"
        class="my-4 border border-4 rounded border-black p-3"
      >
        <h1 class="fw-bold text-center mb-3">Add a New Task</h1>

        <div
          class="btn-wrapper d-flex align-items-center justify-content-center"
        >
          <button
            type="button"
            id="add-btn"
            class="w-100 btn btn-primary btn-customized"
            data-bs-toggle="modal"
            data-bs-target="#form-modal"
          >
            Add
          </button>
        </div>
        <div class="modal fade" id="form-modal">
          <div class="modal-dialog">
            <div class="modal-content">
              <div id="modal-header" class="modal-header light-mode-background">
                <h5 class="fw-bold" id="modal-title">Add New Task</h5>
                <button
                  type="button"
                  id="close-btn"
                  class="btn-close"
                  data-bs-dismiss="modal"
                ></button>
              </div>
              <div class="modal-body" id="modal-body">
                <form class="form">
                  <input type="text" id="edit-id" class="d-none">
                  <div class="form-group row mb-1">
                    <div
                      class="title d-sm-flex align-items-sm-center col-12 col-sm-2"
                    >
                      <label class="fw-bold" for="element-title">Title:</label>
                    </div>
                    <div class="col-12 col-sm-10">
                      <input
                        class="form-control border rounded-3 border-2 border-focus border-dark w-100"
                        type="text"
                        id="element-title"
                      />
                      <span
                        id="title-warning"
                        class="badge bg-danger text-white d-none"
                      ></span>
                    </div>
                  </div>
                  <div class="form-group row mb-1">
                    <div
                      class="title d-sm-flex align-items-sm-center col-12 col-sm-2"
                    >
                      <label class="fw-bold" for="element-status"
                        >Status:</label
                      >
                    </div>
                    <div class="col-12 col-sm-10">
                      <select
                        name="Status"
                        id="element-status"
                        class="form-control border rounded-3 border-2 border-focus border-dark w-100"
                      >
                        <option value="to-do">To do</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                      </select>
                    </div>
                  </div>
                  <div class="form-group row mb-1">
                    <div
                      class="title d-sm-flex align-items-sm-center col-12 col-sm-2"
                    >
                      <label class="fw-bold" for="element-priority"
                        >Priority:</label
                      >
                    </div>
                    <div class="col-12 col-sm-10">
                      <select
                        name="Status"
                        id="element-priority"
                        class="form-control border rounded-3 border-2 border-focus border-dark w-100"
                      >
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                      </select>
                    </div>
                  </div>
                </form>
              </div>
              <div class="modal-footer" id="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
                <button
                  type="button"
                  class="btn btn-primary"
                  id="submit-btn"
                  data-bs-dismiss="modal"
                >
                  Save Changes
                </button>
                <button
                  type="button"
                  class="btn btn-primary"
                  id="edit-btn"
                  data-bs-dismiss="modal"
                >
                  Save Changes
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section
        id="filter-and-list-section"
        class="my-4 border border-4 rounded border-black p-3"
      >
        <h4 class="fw-bold">Search</h4>
        <div class="filter-wrapper row form-group">
          <div class="d-none d-sm-block col-sm-6"></div>
          <div
            class="col-12 col-sm-3 d-sm-flex justify-content-sm-end align-items-sm-center"
          >
            <label class="fw-bold" for="filter">Filter: </label>
          </div>
          <div class="col-12 col-sm-3">
            <input
              class="form-control border rounded-3 border-2 border-focus border-dark w-100"
              type="text"
              id="filter"
              placeholder="  Search..."
            />
          </div>
        </div>
        <hr class="mb-4" />
        <div class="table-wrapper" id="table-wrapper">
          <h4 class="fw-bold text-center">Tasks</h4>
          <div
            id="no-data-wrapper"
            class="d-none flex-column align-items-center justify-content-center gap-2"
          >
            <i class="bi bi-emoji-dizzy display-3"></i>
            <h5 class="fw-bold text-center">No Data</h5>
          </div>
          <table id="data-table" class="table table-hover">
            <thead class="table-primary" id="data-table-head"></thead>
            <tbody id="data-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer id="footer" class="text-center light-mode-background mb-0">
      <p class="p-4 mb-0">&copy; All Right Reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
